name: Nightly Frontend Deploy (docs → S3 + CloudFront)

on:
  schedule:
    # Runs nightly at 01:30 UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::867697377188:role/QDSpace_GitHub_OIDC_DeployRole
          aws-region: us-east-1

      # 1) Sync entire docs/ tree to S3
      - name: Sync docs/ to S3
        run: |
          aws s3 sync docs/ s3://qdspace-frontend-v1 --delete

      # 2) Upload gzipped plot HTMLs as plot.html with correct headers
      - name: Upload gzipped plot HTMLs
        run: |
          find docs/library -path "*properties/plot.html.gz" | while read file; do
            key=${file#docs/}        # remove leading 'docs/'
            key_no_gz=${key%.gz}     # strip '.gz' => .../properties/plot.html
            echo "Uploading $file -> s3://qdspace-frontend-v1/$key_no_gz"
            aws s3 cp "$file" "s3://qdspace-frontend-v1/$key_no_gz" \
              --content-type "text/html; charset=utf-8" \
              --content-encoding "gzip" \
              --cache-control "public, max-age=31536000, immutable"
          done

      # 3) Set immutable cache headers for versioned app-v9.js
      - name: Upload library/app-v9.js with long cache
        run: |
          aws s3 cp docs/library/app-v9.js s3://qdspace-frontend-v1/library/app-v9.js \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

      # 4) Override cache headers for library/index.html (no cache)
      - name: Upload library/index.html with no-cache
        run: |
          aws s3 cp docs/library/index.html s3://qdspace-frontend-v1/library/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      # 5) Invalidate CloudFront cache for updated frontend
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E162YQXF8N223K \
            --paths "/library/index.html" "/library/app-v9.js" "/builder/index.html"

      # 6) Notify Slack (frontend deploy)
      - name: Notify Slack (frontend deploy)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          color="good"
          if [ "$JOB_STATUS" != "success" ]; then
            color="danger"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$color",
                "text": "*Nightly Frontend Deploy (docs → S3 + CloudFront)* finished with *$JOB_STATUS*.\nBranch: \`$GITHUB_REF_NAME\`\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View GitHub Actions run>"
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"