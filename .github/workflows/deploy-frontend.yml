name: Nightly Frontend Deploy (Vite → S3 + CloudFront)

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Removed ref: main to allow branch-specific deployment

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'qd-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./qd-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./qd-frontend
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::867697377188:role/QDSpace_GitHub_OIDC_DeployRole
          aws-region: us-east-1

      # 1) Sync entire dist/ tree to S3
      - name: Sync dist/ to S3
        run: |
          aws s3 sync qd-frontend/dist/ s3://qdspace-frontend-v1 --delete

      # 2) Upload gzipped plot HTMLs with correct headers
      - name: Upload gzipped plot HTMLs
        run: |
          find qd-frontend/dist -path "*properties/plot.html.gz" | while read file; do
            key=${file#qd-frontend/dist/}
            key_no_gz=${key%.gz}
            echo "Uploading $file -> s3://qdspace-frontend-v1/$key_no_gz"
            aws s3 cp "$file" "s3://qdspace-frontend-v1/$key_no_gz" \
              --content-type "text/html; charset=utf-8" \
              --content-encoding "gzip" \
              --cache-control "public, max-age=31536000, immutable"
          done

      # 3) Set immutable cache headers for versioned Vite assets
      - name: Update Cache Headers for Immutable Assets
        run: |
          aws s3 cp s3://qdspace-frontend-v1/assets/ s3://qdspace-frontend-v1/assets/ \
            --recursive \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"

      # 4) Override cache headers for index.html (no cache)
      - name: Upload index.html with no-cache
        run: |
          aws s3 cp qd-frontend/dist/index.html s3://qdspace-frontend-v1/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      # 5) Invalidate CloudFront cache for updated frontend
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E162YQXF8N223K \
            --paths "/index.html" "/assets/*"

      # 6) Notify Slack (frontend deploy)
      - name: Notify Slack (frontend deploy)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          color="good"
          if [ "$JOB_STATUS" != "success" ]; then
            color="danger"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$color",
                "text": "*Nightly Frontend Deploy (Vite → S3 + CloudFront)* finished with *$JOB_STATUS*.\nBranch: \`$GITHUB_REF_NAME\`\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View GitHub Actions run>"
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"