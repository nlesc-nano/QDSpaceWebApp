name: Test Frontend Deploy

on:
  workflow_dispatch:

jobs:
  deploy-frontend-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'qd-frontend/package-lock.json'

      - name: Install dependencies and Build
        working-directory: ./qd-frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::867697377188:role/QDSpace_GitHub_OIDC_DeployRole
          aws-region: us-east-1

      # 1) Sync assets with immutable cache to the test bucket
      - name: Sync static assets to Test S3
        run: |
          aws s3 sync qd-frontend/dist/assets/ s3://qdspace-frontend-test/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # 2) Sync the rest of the build
      - name: Sync rest of frontend to Test S3
        run: |
          aws s3 sync qd-frontend/dist/ s3://qdspace-frontend-test/ \
            --delete \
            --exclude "assets/*" \
            --exclude "*.html.gz" \
            --cache-control "no-cache, no-store, must-revalidate"

      # 3) Upload gzipped HTMLs
      - name: Upload gzipped plot HTMLs
        run: |
          find qd-frontend/dist -name "plot.html.gz" | while read file; do
            key=${file#qd-frontend/dist/}
            key_no_gz=${key%.gz}
            echo "Uploading $file -> s3://qdspace-frontend-test/$key_no_gz"
            aws s3 cp "$file" "s3://qdspace-frontend-test/$key_no_gz" \
              --content-type "text/html; charset=utf-8" \
              --content-encoding "gzip" \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Notify Slack (test deploy)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          color="good"
          if [ "$JOB_STATUS" != "success" ]; then
            color="danger"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$color",
                "text": "*Test Frontend Deploy (${GITHUB_REF_NAME} → Test S3)* finished with *$JOB_STATUS*.\nBranch: \`${GITHUB_REF_NAME}\`\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View GitHub Actions run>"
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"
