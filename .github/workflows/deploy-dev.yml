name: Nightly Backend Deploy (main)

on:
  schedule:
    # Runs every night at 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout main branch
      # We always deploy what's on main (you can change this if desired)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::867697377188:role/QDSpace_GitHub_OIDC_DeployRole
          aws-region: us-east-1

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build SAM application
        run: sam build --use-container

      - name: Deploy SAM application
        run: |
          sam deploy \
            --image-repository 867697377188.dkr.ecr.us-east-1.amazonaws.com/qdspace-lambda \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Change: tag the image in ECR with (1) branch pointer and (2) immutable branch-sha tag
      - name: Tag ECR image with branch and sha
        id: tag
        env:
          AWS_REGION: us-east-1
          ECR_URI: 867697377188.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPO: qdspace-lambda
          BRANCH: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "Fetching :latest manifest for ${ECR_REPO}…"
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPO" \
            --image-ids imageTag=latest \
            --query 'images[0].imageManifest' \
            --output text)

          if [ "${MANIFEST:-None}" = "None" ] || [ -z "${MANIFEST:-}" ]; then
            echo "No :latest image manifest found; skipping extra tags."
            echo "tag_branch=" >> "$GITHUB_OUTPUT"
            echo "tag_sha=" >> "$GITHUB_OUTPUT"
            echo "uri_branch=" >> "$GITHUB_OUTPUT"
            echo "uri_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_BRANCH="branch-${BRANCH}"
          TAG_SHA="${BRANCH}-${SHORT_SHA:0:7}"

          echo "Creating tag: ${TAG_BRANCH}"
          aws ecr put-image \
            --repository-name "$ECR_REPO" \
            --image-tag "$TAG_BRANCH" \
            --image-manifest "$MANIFEST" >/dev/null

          echo "Creating tag: ${TAG_SHA}"
          aws ecr put-image \
            --repository-name "$ECR_REPO" \
            --image-tag "$TAG_SHA" \
            --image-manifest "$MANIFEST" >/dev/null

          echo "tag_branch=${TAG_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${TAG_SHA}"       >> "$GITHUB_OUTPUT"
          echo "uri_branch=${ECR_URI}/${ECR_REPO}:${TAG_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "uri_sha=${ECR_URI}/${ECR_REPO}:${TAG_SHA}"       >> "$GITHUB_OUTPUT"

          echo "ECR tags created:"
          echo "  ${ECR_REPO}:${TAG_BRANCH}"
          echo "  ${ECR_REPO}:${TAG_SHA}"

      - name: Notify Slack (backend deploy)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          TAG_BRANCH: ${{ steps.tag.outputs.tag_branch }}
          TAG_SHA: ${{ steps.tag.outputs.tag_sha }}
        run: |
          color="good"
          [ "$JOB_STATUS" != "success" ] && color="danger"

          tag_lines=""
          if [ -n "${TAG_BRANCH}" ]; then
            tag_lines="${tag_lines}\n• Branch tag: \`${TAG_BRANCH}\`"
          fi
          if [ -n "${TAG_SHA}" ]; then
            tag_lines="${tag_lines}\n• Build tag:  \`${TAG_SHA}\`"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$color",
                "text": "*Nightly Backend Deploy (main)* finished with *$JOB_STATUS*.Branch: \`$GITHUB_REF_NAME\`${tag_lines}<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View GitHub Actions run>"
              }
            ]
          }
          EOF
          )" "$SLACK_WEBHOOK_URL"
