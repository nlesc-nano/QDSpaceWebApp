name: Nightly Backend Deploy (main)

on:
  schedule:
    # Runs every night at 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::867697377188:role/QDSpace_GitHub_OIDC_DeployRole
          aws-region: us-east-1

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2


      - name: Build SAM application
        run: sam build --use-container

      - name: Deploy SAM application
        run: |
          sam deploy \
            --image-repository 867697377188.dkr.ecr.us-east-1.amazonaws.com/qdspace-lambda \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Tag ECR image with branch and sha
        run: |
          set -euo pipefail

          REPO="qdspace-lambda"
          BRANCH="${GITHUB_REF_NAME//\//-}"         # protect against slashes in branch names
          SHORT_SHA="${GITHUB_SHA::7}"

          # 1) Find the most recently pushed image digest in the repo
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPO" \
            --query 'reverse(sort_by(imageDetails,&imagePushedAt))[0].imageDigest' \
            --output text)

          echo "Latest digest in $REPO: $DIGEST"

          # 2) Get its manifest (required by PutImage)
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$REPO" \
            --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifest' \
            --output text)

          # 3) Compose tags
          TAG1="branch-${BRANCH}"
          TAG2="${BRANCH}-${SHORT_SHA}"

          echo "Tagging as: $TAG1 and $TAG2"

          aws ecr put-image --repository-name "$REPO" --image-tag "$TAG1" --image-manifest "$MANIFEST"
          aws ecr put-image --repository-name "$REPO" --image-tag "$TAG2" --image-manifest "$MANIFEST"

          echo "ECR tags created:"
          echo "  $REPO:$TAG1"
          echo "  $REPO:$TAG2"

      - name: Notify Slack (backend deploy)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ steps.tag.outputs.env_tag }}
        run: |
          color="good"
          if [ "$JOB_STATUS" != "success" ]; then
            color="danger"
          fi

          extra=""
          if [ -n "$IMAGE_TAG" ]; then
            extra="\nImage tag: \`$IMAGE_TAG\`"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$color",
                "text": "*Nightly Backend Deploy (main)* finished with *$JOB_STATUS*.$extra\nBranch: \`$GITHUB_REF_NAME\`\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View GitHub Actions run>"
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"