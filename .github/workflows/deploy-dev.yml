name: Nightly Backend Deploy (main)

on:
  schedule:
    # Runs every night at 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::867697377188:role/QDSpace_GitHub_OIDC_DeployRole
          aws-region: us-east-1

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2


      - name: Build SAM application
        run: sam build --use-container

      - name: Deploy SAM application
        run: |
          sam deploy \
            --image-repository 867697377188.dkr.ecr.us-east-1.amazonaws.com/qdspace-lambda \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # add a readable tag in ECR (e.g., main-abc1234 or dev_z-abc1234)
      - name: Tag ECR image with branch+sha
        id: tag
        run: |
          set -euo pipefail
          SHORTSHA="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ENV_TAG="main-${SHORTSHA}"
          elif [ "${GITHUB_REF_NAME}" = "dev_z" ]; then
            ENV_TAG="devz-${SHORTSHA}"
          else
            ENV_TAG="${GITHUB_REF_NAME}-${SHORTSHA}"
          fi

          REPO_NAME="qdspace-lambda"
          REGION="us-east-1"

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag=latest \
            --query 'images[0].imageManifest' \
            --output text --region "$REGION" || true)

          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "No :latest image manifest found in $REPO_NAME; skipping extra tag."
            echo "env_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          aws ecr put-image \
            --repository-name "$REPO_NAME" \
            --image-tag "$ENV_TAG" \
            --image-manifest "$MANIFEST" \
            --region "$REGION"

          echo "Tagged $REPO_NAME:latest as $REPO_NAME:$ENV_TAG"
          echo "env_tag=$ENV_TAG" >> $GITHUB_OUTPUT

      - name: Notify Slack (backend deploy)
        if: always()  # run whether the job succeeds or fails
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          color="good"
          if [ "$JOB_STATUS" != "success" ]; then
            color="danger"
          fi

          extra=""
          if [ -n "$IMAGE_TAG" ]; then
            extra="\nImage tag: \`$IMAGE_TAG\`"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$color",
                "text": "*Nightly Backend Deploy (main)* finished with *$JOB_STATUS*.$extra\nBranch: \`$GITHUB_REF_NAME\`\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View GitHub Actions run>"
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"